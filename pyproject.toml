[project]
name = "artifact-registry-mcp"
version = "1.0.0"
description = "MCP server for Sonatype Nexus Repository 3 and JFrog Artifactory — upload, verify, search, and promote build artifacts across CI/CD and Kubernetes rollouts"
requires-python = ">=3.10"
authors = [
    { name = "Pawan Gunjkar", email = "pawangunjkar@gmail.com" }
]
readme = "README.md"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "nexus", "artifactory", "jfrog", "sonatype", "ci-cd", "devops", "kubernetes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "mcp[cli]>=1.0.0,<2",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
artifact-mcp = "artifact_mcp.server:main"
artifact-registry-mcp = "artifact_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Pawangunjkar/artifact-registry-mcp"
Repository = "https://github.com/Pawangunjkar/artifact-registry-mcp"
Issues = "https://github.com/Pawangunjkar/artifact-registry-mcp/issues"
Documentation = "https://github.com/Pawangunjkar/artifact-registry-mcp#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["artifact_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"server.py" = "server.py"
"artifact_client.py" = "artifact_client.py"
"credential_store.py" = "credential_store.py"

[tool.hatch.build.targets.sdist]
include = [
    "artifact_mcp",
    "server.py",
    "artifact_client.py",
    "credential_store.py",
    "README.md",
    "LICENSE",
]
